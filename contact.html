<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Developer Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <!-- Toggle -->
        <div class="menu-toggle" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- LINKS -->
        <div class="nav-links" id="navLinks">
            <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
            <a href="experience.html"><i class="fa-solid fa-briefcase"></i> Experience</a>
            <a href="project.html"><i class="fa-solid fa-layer-group"></i> Projects</a>
            <a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
        </div>
    </nav>


    <!-- MAIN CONTENT -->
    <main class="container">
        <!-- ========  LEFT SIDE ========= -->
        <div class="left-section">
            <h1><span>Get</span> in Touch</h1>
            <p>
                Have a question or want to work together? <span class="mini-pill"> Drop us a message!</span>
            </p>

        </div>
        <!-- ========  RIGHT SIDE ========= -->
        <section id="contact" class="contact-section">
            <div class="content">
                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <input type="text" id="name" class="form-input" placeholder="Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" class="form-input" placeholder="Email " required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="subject" class="form-input" placeholder="subject" required>
                    </div>
                    <div class="form-group">
                        <textarea id="message" class="form-input" rows="5" placeholder="Message . . ."
                            required></textarea>
                    </div>
                    <button type="submit" class="submit-btn" onclick="sendMail()">Send Message</button>
                </form>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
